name: Build NetHunter Kernel (satsuki)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Install toolchain & deps
        run: |
          apt-get update
          apt-get install -y git make gcc bc bison flex libssl-dev xz-utils wget python3
          ln -sf /usr/bin/python3 /usr/bin/python
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git /opt/gcc49
          /opt/gcc49/bin/aarch64-linux-android-gcc --version | head -1

      - name: Checkout kernel source at commit 39a89de
        uses: actions/checkout@v4
        with:
          ref: 39a89dea6fa300c2e117da1d601da7b3d13b7be4
          fetch-depth: 0
          path: kernel

      - name: Patch broken MODULE_DEVICE_TABLE macro
        run: |
          sed -i 's/MODULE_GENERIC_TABLE(type##__##name##_device, name)/MODULE_GENERIC_TABLE(type##_device, name)/' kernel/include/linux/module.h

      - name: Configure kernel with Wi-Fi & BT drivers
        working-directory: kernel
        run: |
          export ARCH=arm64 CROSS_COMPILE=/opt/gcc49/bin/aarch64-linux-android-
          make ARCH=arm64 KBUILD_DIFFCONFIG=satsuki_diffconfig CROSS_COMPILE=/opt/gcc49/bin/aarch64-linux-android- kitakami_satsuki_defconfig
          scripts/config --file .config \
            -e MODULES \
            -e MODULE_UNLOAD \
            -e MODULE_FORCE_UNLOAD \
            -e MODVERSIONS \
            -e BT \
            -e BT_RFCOMM \
            -e BT_BNEP \
            -e BT_HIDP \
            -e BT_HCIBTUSB \
            -e BT_HCIBTUSB_BCM \
            -e BT_HCIBTUSB_RTL \
            -e BT_HCIUART \
            -e BT_HCIVHCI \
            -e BT_ATH3K \
            -e WIRELESS \
            -e CFG80211 \
            -e CFG80211_WEXT \
            -e MAC80211 \
            -e MAC80211_RC_MINSTREL \
            -e MAC80211_RC_DEFAULT_MINSTREL \
            -e NETDEVICES \
            -e WLAN \
            -e RT2X00 \
            -e RT2800USB \
            -e RT2800USB_RT33XX \
            -e RT2800USB_RT35XX \
            -e RT2800USB_RT53XX \
            -e RT2X00_LIB \
            -e RT2X00_LIB_USB \
            -e RT2X00_LIB_FIRMWARE \
            -e RT2X00_LIB_CRYPTO \
            -e ATH9K_HTC \
            -e RTL8187 \
            -e RTL8XXXU \
            -e PACKET \
            -e NETFILTER
          make ARCH=arm64 CROSS_COMPILE=/opt/gcc49/bin/aarch64-linux-android- olddefconfig
          echo "=== VERIFYING DRIVER FLAGS ==="
          grep -E '^CONFIG_(MODULES|BT_|RT2|MAC80211|CFG80211|ATH9K|RTL8)' .config

      - name: Compile Kernel Image & Modules
        working-directory: kernel
        run: |
          export ARCH=arm64 CROSS_COMPILE=/opt/gcc49/bin/aarch64-linux-android-
          make ARCH=arm64 HOSTCFLAGS="-Wall -Wmissing-prototypes -Wstrict-prototypes -O2 -fno-strict-aliasing -fcommon" CROSS_COMPILE=/opt/gcc49/bin/aarch64-linux-android- -j$(nproc) Image.gz-dtb
          make ARCH=arm64 HOSTCFLAGS="-Wall -Wmissing-prototypes -Wstrict-prototypes -O2 -fno-strict-aliasing -fcommon" CROSS_COMPILE=/opt/gcc49/bin/aarch64-linux-android- -j$(nproc) modules || true
          mkdir -p /tmp/out/modules
          find . -name '*.ko' -exec cp {} /tmp/out/modules/ \; || true
          cp arch/arm64/boot/Image.gz-dtb /tmp/out/Image.gz-dtb
          ls -lh /tmp/out/Image.gz-dtb
          ls -la /tmp/out/modules/

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-kernel-satsuki
          path: /tmp/out/
