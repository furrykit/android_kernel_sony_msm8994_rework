name: Build full kernel

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y git make gcc bc bison flex libssl-dev xz-utils wget python3
          ln -sf /usr/bin/python3 /usr/bin/python
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git /opt/gcc49
          ls /opt/gcc49/bin | head -5
          /opt/gcc49/bin/aarch64-linux-android-gcc --version | head -1

      - name: Checkout kernel at device commit
        uses: actions/checkout@v4
        with:
          ref: 39a89dea6fa300c2e117da1d601da7b3d13b7be4
          fetch-depth: 0
          path: kernel

      - name: Get ramdisk from branch tip
        uses: actions/checkout@v4
        with:
          ref: lineage-19.0
          path: extra
          sparse-checkout: |
            ramdisk.gz
          sparse-checkout-cone-mode: false

      - name: Patch broken MODULE_DEVICE_TABLE macro
        run: |
          sed -i 's/MODULE_GENERIC_TABLE(type##__##name##_device, name)/MODULE_GENERIC_TABLE(type##_device, name)/' kernel/include/linux/module.h

      - name: Configure
        working-directory: kernel
        run: |
          make ARCH=arm64 kitakami_satsuki_defconfig
          scripts/config --file .config \
            -e MODULES \
            -e MODULE_UNLOAD \
            -e BT_HCIVHCI
          make ARCH=arm64 CROSS_COMPILE=/opt/gcc49/bin/aarch64-linux-android- olddefconfig
          grep -E '^CONFIG_(MODULES|BT_HCIVHCI)' .config

      - name: Build kernel
        working-directory: kernel
        run: |
          make ARCH=arm64 HOSTCFLAGS="-Wall -Wmissing-prototypes -Wstrict-prototypes -O2 -fno-strict-aliasing -fcommon" CROSS_COMPILE=/opt/gcc49/bin/aarch64-linux-android- -j2 Image.gz dtbs
          ls -la arch/arm64/boot/Image.gz
          find arch/arm64/boot/dts -name '*.dtb' | wc -l
          find -L arch/arm64/boot/dts -name '*.dtb' -name '*satsuki*' > /tmp/dtblist.txt
          cat /tmp/dtblist.txt
          cat arch/arm64/boot/Image.gz $(cat /tmp/dtblist.txt) > /tmp/Image.gz-dtb
          ls -la /tmp/Image.gz-dtb

      - name: Upload kernel image
        uses: actions/upload-artifact@v4
        with:
          name: kernel-dtb
          path: /tmp/Image.gz-dtb
