name: Build NetHunter Kernel (satsuki)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04
    steps:
      - name: Install toolchain & deps
        run: |
          apt-get update
          apt-get install -y git make gcc bc bison flex libssl-dev xz-utils wget python3
          ln -sf /usr/bin/python3 /usr/bin/python
          git clone --depth=1 https://github.com/LineageOS/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9.git /opt/gcc49
          /opt/gcc49/bin/aarch64-linux-android-gcc --version | head -1

      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: kernel

      - name: Configure kernel with built-in Wi-Fi & BT drivers (no modules)
        working-directory: kernel
        run: |
          export ARCH=arm64 CROSS_COMPILE=/opt/gcc49/bin/aarch64-linux-android-
          make ARCH=arm64 kitakami_satsuki_defconfig
          scripts/config --file .config \
            -e WIRELESS \
            -e CFG80211 \
            -e CFG80211_WEXT \
            -e MAC80211 \
            -e MAC80211_RC_MINSTREL \
            -e MAC80211_RC_DEFAULT_MINSTREL \
            -e NETDEVICES \
            -e WLAN \
            -e RT2X00 \
            -e RT2800USB \
            -e RT2800USB_RT33XX \
            -e RT2800USB_RT35XX \
            -e RT2800USB_RT53XX \
            -e RT2X00_LIB \
            -e RT2X00_LIB_USB \
            -e RT2X00_LIB_FIRMWARE \
            -e RT2X00_LIB_CRYPTO \
            -e ATH9K_HTC \
            -e RTL8187 \
            -e RTL8XXXU \
            -e BT \
            -e BT_RFCOMM \
            -e BT_BNEP \
            -e BT_HIDP \
            -e BT_HCIBTUSB \
            -e BT_HCIBTUSB_BCM \
            -e BT_HCIBTUSB_RTL \
            -e BT_HCIVHCI \
            -e BT_ATH3K \
            -e PACKET \
            -e NETFILTER
          make ARCH=arm64 CROSS_COMPILE=/opt/gcc49/bin/aarch64-linux-android- olddefconfig
          echo "=== VERIFYING MONOLITHIC DRIVER FLAGS ==="
          grep -E '^CONFIG_(MODULES|BT_|RT2|MAC80211|CFG80211|ATH9K|RTL8)' .config
          grep -E '^# CONFIG_MODULES is not set' .config || echo "WARNING: MODULES status unexpected"

      - name: Compile Kernel Image & Image.gz-dtb
        working-directory: kernel
        run: |
          export ARCH=arm64 CROSS_COMPILE=/opt/gcc49/bin/aarch64-linux-android-
          make ARCH=arm64 HOSTCFLAGS="-Wall -Wmissing-prototypes -Wstrict-prototypes -O2 -fno-strict-aliasing -fcommon" CROSS_COMPILE=/opt/gcc49/bin/aarch64-linux-android- -j$(nproc) Image Image.gz-dtb
          mkdir -p /tmp/out
          cp arch/arm64/boot/Image /tmp/out/Image
          cp arch/arm64/boot/Image.gz-dtb /tmp/out/Image.gz-dtb
          ls -lh /tmp/out/

      - name: Upload Kernel Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nethunter-kernel-satsuki
          path: /tmp/out/